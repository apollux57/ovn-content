name: Update Ogden Valley Ski Data

on:
  schedule:
    # Runs every 15 min at :07, :22, :37, :52 to avoid GitHub's top-of-hour queue spikes
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ski-data-update
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run UDOT & NWS fetcher
        env:
          UDOT_API_KEY: ${{ secrets.UDOT_API_KEY }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python fetch_ski_data.py

      - name: Commit updated JSON
        run: |
          git config user.name "OVN Ski Bot"
          git config user.email "actions@github.com"
          git add ovn-ski-data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update live UDOT & NWS ski data"
            git pull --rebase
            git push
          fi
